# Serves the Next.js static export (out/) produced by the build stage.
# Placed at /etc/nginx/conf.d/default.conf inside the nginx:alpine image.

# ---- Legacy URL -> canonical URL redirects ----------------------------------
# The detail-page URL scheme changed over the archive's lifetime:
#
#   old:  /message/{title-slug}/          (title only, trailing slash)
#   now:  /message/mc{id}-{title-slug}    (id-prefixed, no trailing slash)
#
# and because the slug embeds the title, an upstream title edit moves a record's
# canonical URL as well. A static export has nothing to catch the old paths, so
# every previously indexed URL started returning 404 and search engines dropped
# the pages along with their accumulated ranking signals. These maps 301 each of
# them to wherever the record lives now.
#
# `map` requires http context, which conf.d/*.conf is included into. The map
# body is generated at build time by scripts/build-redirects.mjs and copied to
# /etc/nginx/legacy-redirects.map by the Dockerfile.
map_hash_max_size    32768;
# Must exceed the longest key in the generated map; the generated file records
# the current maximum in its header comment.
map_hash_bucket_size 256;

# The last path segment of a detail URL, with any .html suffix and trailing
# slash stripped, so a legacy URL reaches its canonical target in one hop rather
# than bouncing through the normalisation rules first. Nested routes
# (/message/{id}/compare, /message/{id}/v/{ts}) do not match and are left alone.
map $uri $legacy_lookup_key {
    default "";
    "~*^/(?:message|roadmap)/(?<legacy_segment>[^/]+?)(?:\.html)?/?$" $legacy_segment;
}

# Keys are lowercase and nginx matches map strings ignoring case, so /message/MC1182713
# resolves through the same entry as /message/mc1182713. The generator excludes
# any segment that is a live canonical URL, so this can never redirect a page
# onto itself.
map $legacy_lookup_key $legacy_redirect_target {
    default "";
    include /etc/nginx/legacy-redirects.map;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Do not leak the nginx version.
    server_tokens off;

    # ---- Canonicalisation ---------------------------------------------------
    # Exactly one URL serves each page; every other spelling 301s to it, so
    # crawl budget and link signals are never split between /page, /page/ and
    # /page.html. Query strings are preserved.
    if ($legacy_redirect_target) {
        return 301 $legacy_redirect_target$is_args$args;
    }

    # ---- Compression --------------------------------------------------------
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml
        application/manifest+json
        font/ttf
        font/otf;

    # ---- Home page ----------------------------------------------------------
    # Serving index.html by name keeps `/` off the `index` directive, whose
    # internal redirect to /index.html would collide with the 301 below.
    location = / {
        add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        try_files /index.html =404;
    }

    # The home page has one URL, and it is not /index.html.
    location = /index.html {
        return 301 /;
    }

    # Next's 404 page, reachable only through error_page below.
    location = /404.html {
        internal;
    }

    # ---- URL normalisation --------------------------------------------------
    # Regex locations are matched in order, so these run before the asset rules.

    # Page 1 of a paginated service hub is the hub itself; the build never emits
    # a /1, so catch the guessed URL rather than 404 a crawler that tried it.
    location ~ ^(/service/[^/]+)/1$ {
        return 301 $1$is_args$args;
    }

    # The static export writes flat `/route.html` files, which means /route.html
    # and /route serve identical bytes; collapse them onto the extensionless URL
    # that every canonical tag, sitemap entry and feed link already points at.
    location ~ ^(/.+)\.html$ {
        return 301 $1$is_args$args;
    }

    # No route in the export is a directory index, so a trailing slash is always
    # a duplicate of the same path without one.
    location ~ ^(/.+)/$ {
        return 301 $1$is_args$args;
    }

    # ---- Content-hashed Next.js assets: cache forever -----------------------
    location /_next/static/ {
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # ---- Fonts & images: long cache ----------------------------------------
    location ~* \.(?:woff2?|ttf|otf|eot|png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        expires    30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files  $uri =404;
    }

    # ---- robots.txt: must never be cached so GSC always gets a fresh copy ----
    # A cached response confuses the GSC robots.txt tester and can cause it to
    # report a fetch error even when the file is reachable via URL.
    location = /robots.txt {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files  $uri =404;
    }

    # ---- Sitemaps: short cache so a redeploy is picked up quickly ------------
    # Served as application/xml regardless of the container's mime.types, which
    # maps .xml to text/xml.
    location ~* ^/sitemaps?.*\.xml$ {
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files  $uri =404;
    }

    # ---- Machine-readable data: refreshes on every redeploy -----------------
    # messages-index.json, messages-archive.json, message-paths.json,
    # history/*.json, rss.xml, llms.txt
    location ~* \.(?:json|xml|txt)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files  $uri =404;
    }

    # ---- HTML pages ---------------------------------------------------------
    # Static export writes routes as `/route.html` (no trailingSlash), so map
    # extensionless URLs to their .html file; otherwise a real 404.
    #
    # Content is rebuilt on ingest, so browsers revalidate (max-age=0) while
    # shared caches may serve a short-lived copy. This keeps crawler fetches
    # cheap without ever serving stale pages to readers.
    location / {
        add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        # HSTS is best set once at the Coolify/Traefik proxy after HTTPS is live.
        try_files $uri $uri.html =404;
    }

    # Serve Next's generated 404 page with the correct status code.
    error_page 404 /404.html;
}

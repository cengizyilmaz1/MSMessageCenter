# Serves the Next.js static export (out/) produced by the build stage.
# Placed at /etc/nginx/conf.d/default.conf inside the nginx:alpine image.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Do not leak the nginx version.
    server_tokens off;

    # ---- Compression --------------------------------------------------------
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml
        application/manifest+json
        font/ttf
        font/otf;

    # ---- Content-hashed Next.js assets: cache forever -----------------------
    location /_next/static/ {
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # ---- Fonts & images: long cache ----------------------------------------
    location ~* \.(?:woff2?|ttf|otf|eot|png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        expires    30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files  $uri =404;
    }

    # ---- robots.txt: must never be cached so GSC always gets a fresh copy ----
    # A cached response confuses the GSC robots.txt tester and can cause it to
    # report a fetch error even when the file is reachable via URL.
    location = /robots.txt {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files  $uri =404;
    }

    # ---- Machine-readable data: refreshes on every redeploy -----------------
    # messages-index.json, messages-archive.json, message-paths.json,
    # history/*.json, rss.xml, sitemap.xml, llms.txt
    location ~* \.(?:json|xml|txt)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files  $uri =404;
    }

    # ---- HTML pages ---------------------------------------------------------
    # Static export writes routes as `/route.html` (no trailingSlash), so map
    # extensionless URLs to their .html file; fall back to a folder index for
    # any trailingSlash-style routes; otherwise a real 404.
    #
    # Content is rebuilt on ingest, so browsers revalidate (max-age=0) while
    # shared caches may serve a short-lived copy. This keeps crawler fetches
    # cheap without ever serving stale pages to readers.
    location / {
        add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        # HSTS is best set once at the Coolify/Traefik proxy after HTTPS is live.
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Serve Next's generated 404 page with the correct status code.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
